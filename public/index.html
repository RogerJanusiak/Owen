<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <span class="logo">Owen</span>
  </header>

  <main class="board">
    <!-- columns are rendered dynamically from /api/columns -->
  </main>

  <!-- sentinel: never remove or change this element -->
  <span id="sentinel" hidden>Hello, World</span>

  <div id="add-task-modal" class="modal-overlay hidden">
    <div class="modal">
      <p class="modal-title">Add task</p>
      <input type="text" id="modal-task-title" class="modal-input" placeholder="Task name" />
      <div class="modal-actions">
        <button class="btn-cancel" id="modal-cancel">Cancel</button>
        <button class="btn-create" id="modal-submit">Create task</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
