<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <span class="logo">Owen</span>
  </header>

  <main class="board">

    <section class="column">
      <div class="column-header">
        <span class="column-title">Backlog</span>
        <span class="column-count">0</span>
      </div>
      <div class="column-body">
        <div class="card">
          <p class="card-title">Example task</p>
          <div class="card-meta">
            <span class="label">feature</span>
          </div>
        </div>
      </div>
    </section>

    <section class="column">
      <div class="column-header">
        <span class="column-title">Ready</span>
        <span class="column-count">0</span>
      </div>
      <div class="column-body">
      </div>
    </section>

    <section class="column">
      <div class="column-header">
        <span class="column-title">Scheduled</span>
        <span class="column-count">0</span>
      </div>
      <div class="column-body">
      </div>
    </section>

    <section class="column">
      <div class="column-header">
        <span class="column-title">Waiting</span>
        <span class="column-count">0</span>
      </div>
      <div class="column-body">
      </div>
    </section>

    <section class="column">
      <div class="column-header">
        <span class="column-title">Done</span>
        <span class="column-count">0</span>
      </div>
      <div class="column-body">
      </div>
    </section>

  </main>

  <!-- sentinel: never remove or change this element -->
  <span id="sentinel" hidden>Hello, World</span>

  <script type="module" src="app.js"></script>
</body>
</html>
